<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./css/style.css"/>
<link rel="preload" href="./css/style.css" as="style">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Poppins:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<title>Checklist — UAS/DRONE</title>
</head>
<body>
<header class="header">
    <h1>POLÍCIA MILITAR DO ESTADO DE SÃO PAULO</h1><p>COMANDO DE AVIAÇÃO “JOÃO NEGRÃO”</p>
    <img class="brasao" src="/img/brasao_cavpm.png" alt="brasao CavPM">
 </header>
<main>

<section class="card">
    <h2 class="section-title">PRÉ VOO — Núcleo</h2>
    <label class="item">
      <input type="checkbox" data-check>
      <span><strong>Atualizações</strong> (aeronave, rádio controle e aplicativo/flysasfe)</span>
    </label>
    <label class="item">
      <input type="checkbox" data-check>
      <span><strong>Gerenciamento das baterias </strong> (aeronave, rádio controle e dispositivo móvel)</span>
    </label>
    <label class="item">
      <input type="checkbox" data-check>
      <span><strong>Gerenciamento das imagens </strong>(Cartão Micro Sd)</span>
    </label>
    <label class="item">
      <input type="checkbox" data-check>
      <span><strong>Solicitação/ informação de voo para operações programadas </strong>(SARPAS)</span>
    </label>
</section>
<section class="card">
    <h2 class="section-title">PRÉ VOO/DECOLAGEM — Operação</h2>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Confirmar condições climáticas (UAV Forcast)</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Baterias <strong>totalmente</strong> carregadas (aeronave, rádio controle e dispositivo móvel)</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Cartão Micro Sd <strong>inserido</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Fixação das hélices</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Controle de integridade física da aeronave</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Retirada da trava</strong> e da tampa do gimbal</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Posicionar a aeronave em <strong>local seguro</strong> para decolagem – <strong>Inserir Bateria</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Ligar o rádio controle</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Ligar a aeronave</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Verificar “ Aircraft Status” e corrigir possíveis erros ( COMPASS/ IMU)</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Configurar altura e distância limites</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Configurar altura do RTH</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Configurar ação em caso de perda de sinal/ comunicação da aeronave e rádio</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Configurar ação para CRITICAL LOW BATERRY (30% - 15%)</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>ACIONAR OS MOTORES</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Confirmar a marcação do <strong>HOME POINT</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Em uma distância segura testar os comandos da aeronave</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Avisar a equipe que a aeronave está LIVRE PARA VOO</strong></span>
    </label>
</section>
<section class="card">
    <h2 class="section-title">POUSO/PÓS VOO — Operação</h2>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Avisar a equipe que a aeronave está VINDO PARA POUSO</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Certificar-se que o local para pouso é livre de quaisquer tipos de obstáculos</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Pousar sempre com a retaguarda voltada ao Piloto</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Cortar o motor utilizando o Stick Esquerdo</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Desligar a aeronave</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span>Desligar o controle</span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Colocar a trava/a tampa do gimbal</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Inspecionar a integridade da aeronave</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Retirar as hélices</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Guardar o equipamento em case própria</strong></span>
    </label>
    <label class="item">
        <input type="checkbox" data-check>
        <span><strong>Certificar-se que não esqueceu nada no local antes de deixa-lo</strong></span>
    </label>
</section>
<div class="actions">

</div>
</main>
</body>
</html>
